<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Statystyki sesji</title>
  <link rel="stylesheet" href="session_stats.css">
</head>
<body>
  <div id="grz-session-stats" class="ss-window">
    <header id="ss-titlebar" class="ss-titlebar">
      <h1>Statystyki sesji</h1>
      <span class="ss-game-mode">Bitwy losowe</span>
      <button id="ss-close" class="ss-control ss-close" type="button" tabindex="0" aria-label="Zamknij"><span class="ss-control-label">×</span></button>
    </header>
    <div class="ss-controls">
      <div class="ss-scopes" role="group" aria-label="Zakres sesji">
        <button id="ss-scope-launch" class="ss-control ss-scope is-active" title="Od uruchomienia gry — bieżące konto" type="button" tabindex="0" aria-pressed="true"><span class="ss-control-label">Od uruchomienia</span></button>
        <button id="ss-scope-manual" class="ss-control ss-scope" title="Od ręcznego resetu — bieżące konto" type="button" tabindex="0" aria-pressed="false"><span class="ss-control-label">Od resetu</span></button>
        <button id="ss-scope-instance" class="ss-control ss-scope" style="display:none" type="button" tabindex="0" aria-pressed="false"><span class="ss-control-label">Instalacja</span></button>
      </div>
      <div class="ss-toolbar">
        <span id="ss-started" class="ss-period">Oczekiwanie na wyniki bitew…</span>
        <div class="ss-xp-picker" role="group" aria-label="Rodzaj doświadczenia">
          <button id="ss-xp-base" class="ss-control ss-small-toggle is-active" type="button" tabindex="0" aria-pressed="true"><span class="ss-control-label">Bazowe PD</span></button>
          <button id="ss-xp-received" class="ss-control ss-small-toggle" type="button" tabindex="0" aria-pressed="false"><span class="ss-control-label">Otrzymane PD</span></button>
        </div>
      </div>
    </div>
    <div id="ss-scroll" class="ss-scroll" role="main" aria-label="Statystyki i wyniki">
      <div id="ss-summary" class="ss-summary" role="region" aria-label="Cały zakres">
        <p class="ss-empty">Oczekiwanie na dane z gry.</p>
      </div>
      <nav id="ss-group-tabs" class="ss-group-tabs" aria-label="Grupowanie wyników">
        <button id="ss-group-vehicles" type="button" tabindex="0" class="ss-control ss-group-tab is-active" aria-pressed="true"><span class="ss-control-label">Czołgi</span></button>
        <button id="ss-group-maps" type="button" tabindex="0" class="ss-control ss-group-tab" aria-pressed="false"><span class="ss-control-label">Mapy</span></button>
        <button id="ss-group-battles" type="button" tabindex="0" class="ss-control ss-group-tab" aria-pressed="false"><span class="ss-control-label">Bitwy</span></button>
      </nav>
      <div id="ss-list-meta" class="ss-list-meta"></div>
      <div id="ss-groups" role="region" aria-label="Wyniki według czołgów"></div>
    </div>
    <footer class="ss-footer">
      <span id="ss-status" class="ss-status" role="status" aria-live="polite">Oczekiwanie na dane</span>
      <button id="ss-refresh" class="ss-control ss-button ss-quiet" type="button" tabindex="0"><span class="ss-control-label">Odśwież</span></button>
      <button id="ss-reset" class="ss-control ss-button ss-reset" type="button" tabindex="0" disabled><span class="ss-control-label">Wyzeruj zakres</span></button>
    </footer>
    <div id="ss-reset-overlay" class="ss-modal-overlay" style="display:none">
      <div class="ss-confirm" role="dialog" aria-modal="true" aria-labelledby="ss-confirm-title">
        <h2 id="ss-confirm-title">Wyzerować zakres „Od resetu”?</h2>
        <p id="ss-confirm-message">Nowy zakres zacznie się teraz tylko dla bieżącego konta. Pozostałe konta pozostaną bez zmian.</p>
        <div class="ss-confirm-actions">
          <button id="ss-reset-cancel" class="ss-control ss-button" type="button" tabindex="0"><span class="ss-control-label">Anuluj</span></button>
          <button id="ss-reset-confirm" class="ss-control ss-button ss-gold" type="button" tabindex="0"><span class="ss-control-label">Wyzeruj zakres</span></button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="session_stats.js"></script>
</body>
</html>
