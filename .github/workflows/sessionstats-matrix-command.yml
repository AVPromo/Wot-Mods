name: Session Stats Chromium matrix
run-name: 'Session Stats matrix · PR #${{ github.event.issue.number }}'

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  configuration:
    if: >-
      github.event.issue.pull_request && github.event.issue.state == 'open' &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (github.event.comment.body == '/sessionstats-matrix' ||
       github.event.comment.body == '/sessionstats-matrix smoke' ||
       github.event.comment.body == '/sessionstats-matrix full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards: ${{ steps.plan.outputs.shards }}
      target_sha: ${{ steps.plan.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Plan browser work
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/sessionstats/matrix_request.py

  render:
    name: Render Chromium ${{ needs.configuration.outputs.coverage }} shard ${{ matrix.shard }}
    if: needs.configuration.outputs.target_sha != ''
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.configuration.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configuration.outputs.target_sha }}
          persist-credentials: false
      - name: Run with synthetic battles and test graphics
        env:
          COVERAGE: ${{ needs.configuration.outputs.coverage }}
          SHARD_COUNT: ${{ needs.configuration.outputs.shard_count }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$COVERAGE" != smoke ]]; then
            args+=(--shard "$SHARD/$SHARD_COUNT")
          fi
          python3 -I scripts/sessionstats/browser_qa.py --e2e "$COVERAGE" \
            --report-dir "sessionstats-report-part" "${args[@]}"
      - name: Upload intermediate results for the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionstats-matrix-part-${{ matrix.shard }}
          path: |
            sessionstats-report-part/run.json
            sessionstats-report-part/results.ndjson
            sessionstats-report-part/**/*.png
            sessionstats-report-part/**/*.jpg
            sessionstats-report-part/**/*.jpeg
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 1

  report:
    name: Downloadable HTML matrix
    if: ${{ !cancelled() && needs.configuration.result == 'success' && needs.configuration.outputs.target_sha != '' }}
    needs: [configuration, render, browser-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.matrix.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configuration.outputs.target_sha }}
          persist-credentials: false
      - name: Download browser results
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: sessionstats-matrix-part-*
          path: sessionstats-matrix-parts
      - name: Assemble offline HTML and screenshots
        env:
          SHARD_COUNT: ${{ needs.configuration.outputs.shard_count }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=()
          # The download action puts a single matching artifact directly in its
          # destination and creates named subdirectories when several match.
          for part in sessionstats-matrix-parts sessionstats-matrix-parts/sessionstats-matrix-part-*; do
            if [[ -f "$part/run.json" && -f "$part/results.ndjson" ]]; then
              parts+=("$part")
            fi
          done
          node scripts/sessionstats/local-e2e/merge-report.cjs --out sessionstats-matrix-html \
            --expected-shards "$SHARD_COUNT" "${parts[@]}"
      - name: Upload the browsable Session Stats matrix
        id: matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionstats-matrix-html
          path: |
            sessionstats-matrix-html/index.html
            sessionstats-matrix-html/catalog.js
            sessionstats-matrix-html/**/*.png
            sessionstats-matrix-html/**/*.jpg
            sessionstats-matrix-html/**/*.jpeg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Link the HTML matrix from the workflow summary
        if: ${{ !cancelled() && steps.matrix.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.matrix.outputs.artifact-url }}
          TARGET_SHA: ${{ needs.configuration.outputs.target_sha }}
        run: |
          printf 'Tested commit `%s`.\n\n' "$TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Download the [Session Stats HTML matrix](%s), extract the archive, and open `index.html`.\n' \
            "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the report job if upstream checks failed
        if: ${{ !cancelled() }}
        env:
          COVERAGE: ${{ needs.configuration.outputs.coverage }}
          RENDER_RESULT: ${{ needs.render.result }}
          CONTRACT_RESULT: ${{ needs['browser-contracts'].result }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          if [[ "$RENDER_RESULT" != success || "$DOWNLOAD_RESULT" != success ]]; then
            echo '::error::A Chromium render shard or the artifact download did not succeed.'
            exit 1
          fi
          if [[ "$CONTRACT_RESULT" != success && ! ( "$COVERAGE" == smoke && "$CONTRACT_RESULT" == skipped ) ]]; then
            echo '::error::The detailed Chromium checks did not succeed.'
            exit 1
          fi

  browser-contracts:
    name: Detailed Chromium contracts
    if: needs.configuration.outputs.target_sha != '' && needs.configuration.outputs.coverage != 'smoke'
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.configuration.outputs.target_sha }}
          persist-credentials: false
      - name: Generate the synthetic preview
        run: bash scripts/sessionstats/validate.sh preview
      - name: Run all existing browser contracts
        run: python3 -I scripts/sessionstats/browser_qa.py

  notify:
    name: Post matrix result on the pull request
    if: ${{ !cancelled() && needs.configuration.result == 'success' && needs.configuration.outputs.target_sha != '' }}
    needs: [configuration, report]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # This job uses the trusted workflow and GitHub metadata only.
      - name: Append a matrix result comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMAND_ID: ${{ github.event.comment.id }}
          COVERAGE: ${{ needs.configuration.outputs.coverage }}
          TARGET_SHA: ${{ needs.configuration.outputs.target_sha }}
          REPORT_RESULT: ${{ needs.report.result }}
          ARTIFACT_ID: ${{ needs.report.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          def api(path, *args):
              return subprocess.check_output(["gh", "api", path, *args], text=True)

          def positive_id(value):
              return re.fullmatch(r"[1-9][0-9]*", value or "") is not None

          def metadata(path, key):
              try:
                  return json.loads(api(path))[key]
              except (subprocess.CalledProcessError, ValueError, KeyError, TypeError):
                  print(f"Could not resolve matrix {key} metadata.")
                  return []

          env = os.environ
          repo = env["GITHUB_REPOSITORY"]
          pr, command, run, attempt = (env[name] for name in
              ("PR_NUMBER", "COMMAND_ID", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"))
          coverage, sha = env["COVERAGE"], env["TARGET_SHA"]
          if not all(positive_id(value) for value in (pr, command, run, attempt)):
              raise SystemExit("Invalid GitHub event or run metadata")
          if coverage not in ("smoke", "full", "exhaustive") or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid matrix configuration")
          repository_url = f'{env["GITHUB_SERVER_URL"]}/{repo}'
          run_url = f"{repository_url}/actions/runs/{run}"
          run_api = f"repos/{repo}/actions/runs/{run}"
          links = [f"[Actions run]({run_url})"]
          jobs = metadata(f"{run_api}/attempts/{attempt}/jobs?per_page=100", "jobs")
          job = next((str(row["id"]) for row in jobs if row["name"] == "Downloadable HTML matrix"), "")
          if positive_id(job):
              links.insert(0, f"[Report job]({run_url}/job/{job})")
          artifact = env.get("ARTIFACT_ID")
          if positive_id(artifact):
              artifacts = metadata(f"{run_api}/artifacts?name=sessionstats-matrix-html", "artifacts")
              if any(str(row["id"]) == artifact and row["name"] == "sessionstats-matrix-html"
                     and row["expired"] is False for row in artifacts):
                  links.insert(0, f"[Download HTML report]({run_url}/artifacts/{artifact})")

          verdict = {"success": "passed", "failure": "failed",
                     "cancelled": "cancelled", "skipped": "skipped"}.get(env["REPORT_RESULT"], "failed")
          command_url = f"{repository_url}/pull/{pr}#issuecomment-{command}"
          body = "\n\n".join((f"**Session Stats Chromium `{coverage}` — {verdict}.**",
                             f"Tested `{sha[:12]}` in attempt {attempt} from [this command]({command_url}).",
                             " · ".join(links)))
          comments_api = f"repos/{repo}/issues/{pr}/comments"
          api(comments_api, "--method", "POST", "-f", f"body={body}", "--silent")
          PY
