name: Validate mod PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Privacy, tests, deterministic build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python and baseline version
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          cat VERSION
      - name: Privacy scan
        shell: bash
        run: python3 scripts/privacy_audit.py
      - name: Unit and packaging tests
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Rebuild from source and verify baseline checksum
        shell: bash
        run: |
          set -euo pipefail
          python3 source/build_wotmod.py
          echo '9f3d98948ed398c3a4dc14b6785b68f10f1319381f896c6cd49b8709359c4927  dist/com.staysharp.medkitreminder_1.6.0.wotmod' | sha256sum --check --status
          python3 scripts/privacy_audit.py --scan-dist
      - name: Test next-release version interpolation
        shell: bash
        env:
          WOTMOD_VERSION: '1.6.1'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -q
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
