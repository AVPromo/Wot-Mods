name: Session Stats Chromium matrix

on:
  workflow_dispatch:
    inputs:
      coverage:
        description: >-
          exhaustive runs every combination across all date ranges,
          full checks all sorts for primary ranges, smoke checks the report on a small set
        type: choice
        options:
          - exhaustive
          - full
          - smoke
        default: exhaustive
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  configuration:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.label.name == 'sessionstats-full-matrix' || github.event.label.name == 'sessionstats-report-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      coverage: ${{ steps.plan.outputs.coverage }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Plan browser work
        id: plan
        env:
          REQUESTED_COVERAGE: ${{ inputs.coverage || (github.event.label.name == 'sessionstats-report-smoke' && 'smoke' || 'exhaustive') }}
        run: |
          set -euo pipefail
          case "$REQUESTED_COVERAGE" in
            smoke) count=1 ;;
            full) count=16 ;;
            exhaustive) count=64 ;;
            *) exit 2 ;;
          esac
          shards="$(python3 -c 'import json, sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))' "$count")"
          printf 'coverage=%s\nshard_count=%s\nshards=%s\n' "$REQUESTED_COVERAGE" "$count" "$shards" >> "$GITHUB_OUTPUT"

  render:
    name: Render Chromium ${{ needs.configuration.outputs.coverage }} shard ${{ matrix.shard }}
    if: needs.configuration.result == 'success'
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.configuration.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run with synthetic battles and test graphics
        env:
          COVERAGE: ${{ needs.configuration.outputs.coverage }}
          SHARD_COUNT: ${{ needs.configuration.outputs.shard_count }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$COVERAGE" != smoke ]]; then
            args+=(--shard "$SHARD/$SHARD_COUNT")
          fi
          python3 -I scripts/sessionstats/browser_qa.py --e2e "$COVERAGE" \
            --report-dir "sessionstats-report-part" "${args[@]}"
      - name: Upload intermediate results for the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionstats-matrix-part-${{ matrix.shard }}
          path: |
            sessionstats-report-part/run.json
            sessionstats-report-part/results.ndjson
            sessionstats-report-part/**/*.png
            sessionstats-report-part/**/*.jpg
            sessionstats-report-part/**/*.jpeg
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 1

  report:
    name: Downloadable HTML matrix
    if: ${{ !cancelled() && needs.configuration.result == 'success' }}
    needs: [configuration, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download browser results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: sessionstats-matrix-part-*
          path: sessionstats-matrix-parts
      - name: Assemble offline HTML and screenshots
        env:
          SHARD_COUNT: ${{ needs.configuration.outputs.shard_count }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=()
          for part in sessionstats-matrix-parts/sessionstats-matrix-part-*; do
            if [[ -f "$part/run.json" && -f "$part/results.ndjson" ]]; then
              parts+=("$part")
            fi
          done
          node scripts/sessionstats/local-e2e/merge-report.cjs --out sessionstats-matrix-html \
            --expected-shards "$SHARD_COUNT" "${parts[@]}"
      - name: Upload the browsable Session Stats matrix
        id: matrix
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionstats-matrix-html
          path: |
            sessionstats-matrix-html/index.html
            sessionstats-matrix-html/catalog.js
            sessionstats-matrix-html/**/*.png
            sessionstats-matrix-html/**/*.jpg
            sessionstats-matrix-html/**/*.jpeg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Link the HTML matrix from the workflow summary
        if: ${{ !cancelled() && steps.matrix.outcome == 'success' }}
        env:
          ARTIFACT_URL: ${{ steps.matrix.outputs.artifact-url }}
        run: |
          printf 'Download the [Session Stats HTML matrix](%s), extract the archive, and open `index.html`.\n' \
            "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

  browser-contracts:
    name: Detailed Chromium contracts
    if: needs.configuration.outputs.coverage != 'smoke'
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate the synthetic preview
        run: bash scripts/sessionstats/validate.sh preview
      - name: Run all existing browser contracts
        run: python3 -I scripts/sessionstats/browser_qa.py
