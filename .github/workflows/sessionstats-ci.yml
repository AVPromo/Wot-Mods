name: Validate Session Stats PR

on:
  pull_request:
    branches: [main, ci/sessionstats-build-releases]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sessionstats:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source import
        id: source
        run: python3 scripts/sessionstats/source_state.py
      - name: Test release infrastructure
        run: python3 -m unittest discover -s tests -v
      - name: Compile verified CPython 2.7.18 for game bytecode
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/python27.sh
      - name: Test, build, audit and reproduce Session Stats
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh
      - name: Upload reviewed Session Stats build
        if: steps.source.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionstats-pr-${{ github.run_id }}
          path: mods/sessionstats/dist/*
          if-no-files-found: error
          retention-days: 14
