name: Validate Session Stats PR

on:
  pull_request:
    branches: [main, ci/sessionstats-build-releases]
    # Native PR filters use the full branch diff, not just the newest commit.
    paths:
      - '.github/workflows/wot-updates.yml'
      - '.github/workflows/wot-update-watch.yml'
      - 'scripts/wot_updates.py'
      - 'scripts/wot_dispatch.py'
      - 'tests/test_wot_updates.py'
      - 'mods/sessionstats/**'
      - 'scripts/sessionstats/**'
      - 'scripts/release_version.py'
      - 'scripts/release_snapshot.sh'
      - 'scripts/release_installers.py'
      - 'scripts/release_coordinator.py'
      - 'scripts/release_ruleset.py'
      - 'scripts/release_modules.json'
      - 'scripts/build_release_module.sh'
      - 'scripts/privacy_audit.py'
      - 'tests/test_sessionstats_*.py'
      - 'tests/test_release_installers.py'
      - 'tests/test_hangar_release_installers.py'
      - 'tests/test_release_pipeline.py'
      - 'tests/test_release_snapshot.py'
      - 'tests/test_pr_ci_scoping.py'
      - 'tests/test_release_coordinator.py'
      - 'tests/test_release_ruleset.py'
      - 'tests/test_unified_release_workflow.py'
      - '.github/workflows/sessionstats-ci.yml'
      - '.github/workflows/sessionstats-matrix-command.yml'
      - '.github/actions/python27/**'
      - 'tests/test_ci_optimizations.py'
      - '.github/workflows/wotmods-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer PR commit supersedes its validation, but manual runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  updates:
    uses: ./.github/workflows/wot-updates.yml
    with:
      strict: false
  sessionstats:
    needs: updates
    runs-on: ubuntu-24.04
    cache-mode: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect source import
        id: source
        run: python3 scripts/sessionstats/source_state.py
      - name: Test release infrastructure
        run: |
          python3 -m unittest discover -s tests -p 'test_sessionstats_*.py' -v
          python3 -m unittest discover -s tests -p 'test_release_*.py' -v
          python3 -m unittest discover -s tests -p 'test_hangar_release_installers.py' -v
          python3 -m unittest discover -s tests -p 'test_pr_ci_scoping.py' -v
          python3 -m unittest discover -s tests -p 'test_ci_optimizations.py' -v
      - name: Test Chromium report assembly
        if: steps.source.outputs.enabled == 'true'
        run: node --test scripts/sessionstats/local-e2e/merge-report.test.cjs scripts/sessionstats/local-e2e/report.test.cjs scripts/sessionstats/local-e2e/run.test.cjs
      - name: Test Session Stats navigation acknowledgements
        if: steps.source.outputs.enabled == 'true'
        run: |
          node mods/sessionstats/tests/ui-filter-ux.cjs
          node mods/sessionstats/tests/ui-bidirectional-pages.cjs
          node mods/sessionstats/tests/ui-battle-jump.cjs
          node mods/sessionstats/tests/ui-page-jump.cjs
          node mods/sessionstats/tests/ui-window-settings-source.cjs
      - name: Restore or compile verified CPython 2.7.18
        if: steps.source.outputs.enabled == 'true'
        uses: ./.github/actions/python27
      - name: Generate current Session Stats preview
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh preview
      - parallel:
          - name: Test Session Stats on Python 3
            if: steps.source.outputs.enabled == 'true'
            run: bash scripts/sessionstats/validate.sh python3
          - name: Test Session Stats on Python 2.7
            if: steps.source.outputs.enabled == 'true'
            run: bash scripts/sessionstats/validate.sh python27
          - name: Run short Session Stats Chromium smoke
            if: steps.source.outputs.enabled == 'true'
            run: bash scripts/sessionstats/validate.sh browser
      - name: Build twice and verify all six release assets
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh build
      - name: Verify module integration
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh integration
      - name: Audit source, archives and game bytecode
        if: steps.source.outputs.enabled == 'true'
        run: bash scripts/sessionstats/validate.sh privacy
      - name: Package independently verified Session Stats PR installer
        if: steps.source.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          python3 scripts/release_installers.py package pr-artifact-sessionstats \
            --source mods/sessionstats/dist --mod sessionstats
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.release_installers import verify
          installers = list(Path('pr-artifact-sessionstats').glob('Session-Stats-v*.zip'))
          assert len(installers) == 1
          kind, version, _, files, _ = verify(installers[0])
          assert kind == 'sessionstats'
          docs = 'docs/sessionstats/'
          required = (
              'INSTALL.txt', 'USER_GUIDE.txt', 'CHANGELOG.md', 'PREVIEW.html',
              'source/USER_GUIDE.txt', 'source/CHANGELOG.md', 'source/preview/PREVIEW.html',
              'source/preview/demo_snapshot.json',
          )
          assert all(files.get(docs + name) for name in required), 'Missing Session Stats documentation'
          legacy = {'README_PL.txt', 'ZMIANY.txt', 'PODGLAD.html'}
          assert not any(Path(name).name in legacy for name in files), 'Legacy documentation filename in ZIP'
          snapshots = json.loads(files[docs + 'source/preview/demo_snapshot.json'])
          assert {snapshot['version'] for snapshot in snapshots.values()} == {version}, 'Preview version differs from the installer'
          PY
      - name: Upload installable Session Stats ZIP without repackaging
        if: steps.source.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: pr-artifact-sessionstats/Session-Stats-v*.zip
          # Upload the verified installer directly; no second ZIP wrapper.
          archive: false
          if-no-files-found: error
          retention-days: 14
