name: Recover an interrupted WotMod Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to recover, e.g. v1.6.1'
        required: true
        type: string

permissions:
  contents: read

# Share the lock with the automatic publication workflow.
concurrency:
  group: wotmod-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    name: Rebuild exact tagged source after manual draft cleanup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout reviewed release publisher from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: publisher

      - name: Resolve release tag using Git only
        id: tagged
        shell: bash
        working-directory: publisher
        env:
          RECOVER_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RECOVER_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          refs="$(git ls-remote --tags origin "refs/tags/$RECOVER_TAG" "refs/tags/$RECOVER_TAG^{}")"
          direct=""
          peeled=""
          while IFS=$'\t' read -r sha ref; do
            [[ -z "$sha" ]] && continue
            case "$ref" in
              "refs/tags/$RECOVER_TAG") direct="$sha" ;;
              "refs/tags/$RECOVER_TAG^{}") peeled="$sha" ;;
              *) echo 'Unexpected tag ref' >&2; exit 1 ;;
            esac
          done <<< "$refs"
          commit="${peeled:-$direct}"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Tag not found or not a commit' >&2; exit 1; }
          printf 'commit=%s\nversion=%s\n' "$commit" "${RECOVER_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout original source from exact tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.tagged.outputs.commit }}
          path: tagged_source

      - name: Audit and rebuild the exact tagged source
        working-directory: tagged_source
        shell: bash
        env:
          TARGET_COMMIT: ${{ steps.tagged.outputs.commit }}
          WOTMOD_VERSION: ${{ steps.tagged.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          python3 scripts/privacy_audit.py
          python3 -m unittest discover -s tests -q
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
          (
            cd dist
            sha256sum -- *.wotmod > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Verify or publish release without deleting any existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ steps.tagged.outputs.version }}
          RELEASE_COMMIT: ${{ steps.tagged.outputs.commit }}
          STAYSHARP_RECOVERY_MODE: '1'
          STAYSHARP_DIST_DIR: ${{ github.workspace }}/tagged_source/dist
        run: |
          set -euo pipefail
          cd publisher
          bash scripts/publish_release.sh
