name: Release WotMod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build, validate and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout merged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compute unique release patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/release_version.py --run-number "$GITHUB_RUN_NUMBER")"
          echo "WOTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Scan source for private data
        shell: bash
        run: python3 scripts/privacy_audit.py
      - name: Run full regression suite for exact release version
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Produce and verify release asset
        shell: bash
        run: |
          set -euo pipefail
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
          (
            cd dist
            sha256sum -- *.wotmod > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish GitHub Release and .wotmod asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
            if [[ "$existing_sha" != "$GITHUB_SHA" ]]; then
              echo "ERROR: release tag $RELEASE_TAG points to a different commit" >&2
              exit 1
            fi
            echo "Release $RELEASE_TAG already exists for this commit; never overwrite a published artifact."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/*.wotmod dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Stay Sharp Medkit Reminder v$RELEASE_VERSION" \
            --generate-notes
          gh release view "$RELEASE_TAG" --json url --jq .url
