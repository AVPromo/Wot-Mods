name: Release WotMod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Always serialize publications, including manual reruns.
concurrency:
  group: wotmod-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Build, validate and publish Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout merged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compute unique release patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 scripts/release_version.py --run-number "$GITHUB_RUN_NUMBER")"
          echo "WOTMOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Scan source for private data
        shell: bash
        run: python3 scripts/privacy_audit.py
      - name: Run full regression suite for exact release version
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Produce and verify release asset
        shell: bash
        run: |
          set -euo pipefail
          python3 source/build_wotmod.py
          python3 scripts/privacy_audit.py --scan-dist
          (
            cd dist
            sha256sum -- *.wotmod > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
      - name: Publish or safely resume GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/publish_release.sh
